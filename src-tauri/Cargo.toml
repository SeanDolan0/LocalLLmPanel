[package]
name = "llm-panel"
version = "1.2.2"
description = "Local vLLM Panel — manage vLLM servers inside WSL2"
authors = ["Local LLM Panel"]
edition = "2021"

[lib]
name = "llm_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "llm-panel"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "gzip", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
dirs = "6"
anyhow = "1"
regex-lite = "0.1"
llmfit-core = { path = "crates/llmfit-core" }

[profile.release]
# Thin LTO preserves cross-crate optimization while avoiding the much
# slower whole-program optimization pass used by full LTO.
codegen-units = 16
lto = "thin"
incremental = true
strip = true

# Build scripts and proc-macros do not need release optimization. Keeping
# these fast reduces the fixed overhead of every release build.
[profile.release.build-override]
opt-level = 0
codegen-units = 256
incremental = true
