[package]
name = "llm-panel"
version = "1.1.2"
description = "Local vLLM Panel — manage vLLM servers inside WSL2"
authors = ["Local LLM Panel"]
edition = "2021"

[lib]
name = "llm_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "llm-panel"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "gzip", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
dirs = "6"
anyhow = "1"
regex-lite = "0.1"
llmfit-core = { path = "crates/llmfit-core" }

[profile.release]
codegen-units = 1
lto = true
strip = true
