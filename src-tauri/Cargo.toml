[package]
name = "llm-panel"
version = "1.2.3"
description = "Local vLLM Panel — manage vLLM servers inside WSL2"
authors = ["Local LLM Panel"]
edition = "2021"

[lib]
name = "llm_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "llm-panel"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "gzip", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
dirs = "6"
anyhow = "1"
regex-lite = "0.1"
llmfit-core = { path = "crates/llmfit-core" }

[profile.release]
# Fast release compilation: opt-level 3 gives full runtime speed, while
# disabling LTO and incremental caching eliminates multi-minute LLVM link passes.
opt-level = 3
codegen-units = 16
lto = false
incremental = false
strip = true

# Build scripts and proc-macros do not need release optimization.
[profile.release.build-override]
opt-level = 0
codegen-units = 256
incremental = false

# Optional maximum-optimization profile if full inter-crate LTO is ever desired for final public distribution.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

