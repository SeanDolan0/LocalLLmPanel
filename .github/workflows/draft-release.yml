name: Draft release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v2.1.4)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-draft:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Step-level `if:` can't see step-level env, so expose this at job level.
      HAS_AUTHENTICODE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Adjust if your Cargo.toml lives somewhere other than src-tauri
          workspaces: src-tauri -> target
          shared-key: release
          # Tag refs can read the default branch's cache but not each other's.
          # Only save from main (see cache-warm.yml) so tags don't waste cache space.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure LLVM linker
        shell: pwsh
        run: |
          # windows-latest already ships LLVM; only install if it's missing.
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'lld-link.exe'))) {
            choco install llvm --yes --no-progress
          }
          if (-not (Test-Path (Join-Path $llvmBin 'lld-link.exe'))) {
            throw "lld-link.exe was not found in $llvmBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches application version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG does not match package version $expectedTag"
          }

      - name: Security audit gate
        run: npm run audit:check

      - name: Validate release metadata
        run: npm run release:check

      - name: Build executable, NSIS installer, and signed updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REQUIRE_SIGNED_RELEASE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '1' || '0' }}
        run: npm run build:setup

      - name: Authenticode sign executables
        if: env.HAS_AUTHENTICODE == 'true'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "authenticode.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Select-Object -First 1).FullName
          }
          if (-not $signtool) {
            throw "signtool.exe not found on runner"
          }
          try {
            Get-ChildItem dist-release -Filter "*.exe" | ForEach-Object {
              & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr "http://timestamp.digicert.com" /td sha256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
            }
          } finally {
            Remove-Item -Force $certPath -ErrorAction SilentlyContinue
          }

      - name: Regenerate exe checksums after signing
        if: env.HAS_AUTHENTICODE == 'true'
        shell: pwsh
        run: |
          # Signing changes the exe bytes, so the checksums from the build are stale.
          # Assumes the "<hash>  <filename>" format; match this to your build script.
          Get-ChildItem dist-release -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)" -NoNewline
          }

      - name: Validate release files, signatures, and SHA-256 checksums
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REQUIRE_SIGNED_RELEASE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '1' || '0' }}
        run: node scripts/validate-release.mjs --setup --artifacts

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            dist-release/*.exe
            dist-release/*.zip

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $assets = @(
            Get-ChildItem dist-release -File |
              Where-Object {
                $_.Name -like 'LocalLLMPanel-*.exe' -or
                $_.Name -like 'LocalLLMPanel-*.exe.sha256' -or
                $_.Name -like 'Local.LLM.Panel_*_x64-setup.exe' -or
                $_.Name -like 'Local.LLM.Panel_*_x64-setup.exe.sha256' -or
                $_.Name -like 'Local.LLM.Panel_*_x64-setup.nsis.zip' -or
                $_.Name -like 'Local.LLM.Panel_*_x64-setup.nsis.zip.sha256' -or
                $_.Name -like 'Local.LLM.Panel_*_x64-setup.nsis.zip.sig' -or
                $_.Name -like 'latest.json'
              }
          )
          if ($assets.Count -lt 4) {
            throw "Expected release files (installer, standalone exe, and checksums), found $($assets.Count)"
          }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @assetPaths --draft --generate-notes --verify-tag --title "$env:RELEASE_TAG"
