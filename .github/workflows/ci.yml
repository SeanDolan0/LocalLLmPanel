name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Install LLVM (for lld-link)
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'lld-link.exe'))) {
            throw "LLVM installed but lld-link.exe was not found in $llvmBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release metadata
        run: node scripts/validate-release.mjs --setup

      - name: Frontend contract smoke tests
        run: npm run test:contract

      - name: TypeScript and Vite build
        run: npm run build

      - name: Cargo workspace check
        run: cargo check --workspace --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust workspace tests
        run: cargo test --workspace --locked --manifest-path src-tauri/Cargo.toml

      - name: Build standalone release artifact
        run: npm run build:fast

      - name: Validate release artifact and checksum
        run: node scripts/validate-release.mjs --fast --artifacts

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cd src-tauri; cargo audit

      - name: NPM audit
        run: npm audit --audit-level=moderate
