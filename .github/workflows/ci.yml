name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-contracts:
    name: Lint & Frontend Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Validate release metadata
        run: npm run release:check

      - name: Frontend contract & smoke tests
        run: npm run test:contract

      - name: Build frontend
        run: npm run build

      - name: Install Rust (fmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  test-core-linux:
    name: Cross-Platform Core Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-

      - name: Test llmfit-core crate
        run: cargo test -p llmfit-core --locked --manifest-path src-tauri/Cargo.toml

  windows-build-and-test:
    name: Windows Build & Test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install LLVM linker
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'lld-link.exe'))) {
            throw "LLVM installed but lld-link.exe was not found in $llvmBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked

      - name: Check Rust workspace
        run: cargo check --workspace --locked --manifest-path src-tauri/Cargo.toml

      - name: Test Rust workspace
        run: cargo test --workspace --locked --manifest-path src-tauri/Cargo.toml

      - name: Build standalone Windows executable
        run: npm run build:fast

      - name: Validate build artifacts and checksums
        run: node scripts/validate-release.mjs --fast --artifacts

      - name: Upload standalone executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-panel-windows-standalone
          path: |
            dist-release/LocalLLMPanel-*.exe
            dist-release/LocalLLMPanel-*.exe.sha256
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency Security Audits
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
