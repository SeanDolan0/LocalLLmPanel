name: Security Audit

on:
  schedule:
    - cron: '15 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-rust:
    name: Rust Security Advisory Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Scan Cargo dependencies with rustsec
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          ignore: RUSTSEC-2024-0370,RUSTSEC-2024-0429

  audit-npm:
    name: npm Security Advisory Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm security audit gate
        run: node scripts/security-audit.mjs
