name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Rust is skipped on pushes to main: the PR that got merged already
        # analyzed it, and the weekly schedule still covers direct pushes.
        language: ${{ fromJSON(github.event_name == 'push' && '["javascript-typescript","actions"]' || '["javascript-typescript","rust","actions"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # ubuntu-latest ships with rustup/cargo, which is all build-mode: none needs.
      # If CodeQL complains about the toolchain, restore dtolnay/rust-toolchain here.
      - name: Cache cargo registry
        if: matrix.language == 'rust'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codeql-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: codeql-cargo-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
